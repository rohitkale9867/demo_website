<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tic Tac Toe UI </title>
<style>
  body {
    background: #121212;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #eee;
  }

  .game-container {
    background: #1e1e1e;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 0 15px #00ff99;
    width: 320px;
  }

  h1 {
    text-align: center;
    margin-bottom: 20px;
    color: #00ff99;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
  }

  .cell {
    background: #333;
    border-radius: 10px;
    height: 100px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 3rem;
    cursor: pointer;
    user-select: none;
    transition: background 0.3s ease, transform 0.2s ease;
  }

  .cell:hover {
    background: #00ff99;
    color: #121212;
    transform: scale(1.1);
  }

  /* Static X and O for demo */
  .cell:nth-child(odd)::before {
    content: "X";
  }

  .cell:nth-child(even)::before {
    content: "O";
  }
</style>
</head>
<body>
  <div class="game-container">
    <h1>Tic Tac Toe</h1>
    <div class="board">
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
    </div>
  </div>
</body>
</html>
